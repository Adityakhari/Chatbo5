<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Instagram Chat</title>

<style>

body{
margin:0;
background:#000;
font-family:Arial;
color:white;
}

.chat{
max-width:650px;
margin:auto;
padding:20px;
display:flex;
flex-direction:column;
}

.msg{
max-width:70%;
padding:10px 14px;
border-radius:18px;
margin:4px 0;
font-size:14px;
}

.me{
align-self:flex-end;
background:#ff2da4;
}

.them{
align-self:flex-start;
background:#262626;
}

.time{
font-size:10px;
opacity:.7;
margin-top:4px;
}

</style>

</head>

<body>

<div id="chat" class="chat"></div>

<script>

const myName = "Aditya"; // put your username here

/* PASTE YOUR JSON HERE */

const data = {
  "messages":[
    {
      "sender_name":"Aditya",
      "timestamp_ms":1700000000000,
      "content":"Hey"
    },
    {
      "sender_name":"Friend",
      "timestamp_ms":1700000002000,
      "content":"Hi"
    }
  ]
};

/* CHAT RENDERER */

const chat=document.getElementById("chat");

data.messages
.sort((a,b)=>a.timestamp_ms-b.timestamp_ms)
.forEach(msg=>{

if(!msg.content) return;

let div=document.createElement("div");

if(msg.sender_name===myName){
div.className="msg me";
}else{
div.className="msg them";
}

let time=new Date(msg.timestamp_ms)
.toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'});

div.innerHTML=msg.content+"<div class='time'>"+time+"</div>";

chat.appendChild(div);

});

</script>

</body>
</html>
